[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwenrsi"
version = "0.2.0"
description = "Editable agent controllers with a Qwenputer RV32 trace JIT"
readme = "README.md"
authors = [{name = "Tong Zhang"}]
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26", "safetensors>=0.4"]

[project.optional-dependencies]
gpu = ["torch>=2.5", "transformers>=5", "accelerate>=1", "huggingface-hub>=0.30", "ziglang>=0.14,<0.15"]
dev = ["pytest>=8", "ruff>=0.6", "build"]

[project.scripts]
qwenrsi = "qwenrsi.cli:main"

[project.urls]
Source = "https://github.com/tongmd/QwenRSI"
Model = "https://huggingface.co/StoneZhang/QwenRSI-Controller-v0.1"
Issues = "https://github.com/tongmd/QwenRSI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenrsi"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/qwenputer/chipformer" = "qwenrsi/_vendor/chipformer"
"vendor/qwenputer/LICENSE" = "qwenrsi/_vendor/QWENPUTER_LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
